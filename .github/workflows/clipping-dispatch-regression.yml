name: Clipping uncertain-dispatch regression

on:
  push:
    branches: [fix/clipper-youtube-import-diagnostics]
    paths:
      - "internal/app/clipping_*.go"
      - "internal/app/processor.go"
      - "internal/app/dashboard_clipping.go"
      - "internal/webui/static/clipping.js"
      - "tests/clipping-ui.test.cjs"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/clipping-dispatch-regression.yml"
  pull_request:
    paths:
      - "internal/app/clipping_*.go"
      - "internal/app/processor.go"
      - "internal/app/dashboard_clipping.go"
      - "internal/webui/static/clipping.js"
      - "tests/clipping-ui.test.cjs"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/clipping-dispatch-regression.yml"

jobs:
  go-clipping-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test full Go clipping backend contracts
        run: go test ./internal/app -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test clipping dashboard behavior
        run: node --test tests/clipping-ui.test.cjs
