services:
  # Docker creates named volumes as root-owned. This one-shot initializer grants
  # the unprivileged application user access before the dashboard starts.
  volume-init:
    image: video-automation:local
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/videos /data/projects
        chown -R app:app /data
    volumes:
      - video_automation_data:/data
    restart: "no"

  video-automation:
    image: video-automation:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      # Required for new durable Modal callback jobs. Set this to the public
      # HTTPS origin that Modal can reach; PUBLIC_BASE_URL remains a fallback.
      VIDEO_CALLBACK_BASE_URL: ${VIDEO_CALLBACK_BASE_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Optional first-run bootstrap only. Prefer the authenticated Settings UI.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional YouTube imports. Imports need a paid Apify plan with saveMedia
      # entitlement; secrets stay in the server environment, never browser config.
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_YOUTUBE_ACTOR_ID: ${APIFY_YOUTUBE_ACTOR_ID:-}
      APIFY_REQUEST_TIMEOUT: ${APIFY_REQUEST_TIMEOUT:-60s}
      APIFY_MAX_POLL_DURATION: ${APIFY_MAX_POLL_DURATION:-4h}
    volumes:
      - video_automation_data:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  video_automation_data:
    name: video_automation_data
